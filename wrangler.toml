name = "jubeat-dan"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

# ============================================================
# 生产环境（main 分支）：连接生产 D1 / KV / R2
# ============================================================
[env.production]

[[env.production.d1_databases]]
binding = "DB"
database_name = "jubeat-dan"
database_id = "97bd8fc2-e52c-4f1a-bae4-b24d39169ca4"

[[env.production.kv_namespaces]]
binding = "LEADERBOARD_CACHE"
id = "0a5a5d4be1ba46f1ab9ccd5c1ecfb28a"

[[env.production.r2_buckets]]
binding = "SONG_IMAGES"
bucket_name = "jubeat-dan-assets"

# ============================================================
# 预览环境（dev 分支）：D1 / KV 使用独立资源隔离数据，
# R2 沿用生产桶
# ============================================================
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "jubeat-dan-preview"
database_id = "a297d123-8c60-410e-84ff-fe4fcfa8f0d1"

[[env.preview.kv_namespaces]]
binding = "LEADERBOARD_CACHE"
id = "dcecf62ebe4343d99231f839b6408998"

[[env.preview.r2_buckets]]
binding = "SONG_IMAGES"
bucket_name = "jubeat-dan-assets"
