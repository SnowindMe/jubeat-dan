<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUBEAT 段位挑战 · 音乐魔方</title>
  <link rel="icon" type="image/png" href="assets/jubeat-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="candy-field" aria-hidden="true"></div>

  <header class="hero">
    <div class="grid-bg" id="gridBg" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="logo">
        <img class="logo-img" src="assets/jubeat-icon.png" alt="jubeat">
        <div class="logo-text">
          <h1>段位挑战</h1>
          <p class="subtitle">jubeat 音乐魔方 · 段位认定进度追踪</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="筛选">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="cleared">已通过</button>
        <button class="chip" data-filter="pending">未通过</button>
      </div>
      <div class="actions">
        <button class="btn" id="boardBtn" title="查看排行榜">🏆 排行榜</button>
        <button class="btn" id="loginBtn" title="设置玩家昵称">👤 登录</button>
        <button class="btn" id="manageBtn" title="管理员：增删段位、编辑曲目">✏️ 管理段位</button>
        <div class="dropdown" id="settingsDropdown">
          <button class="btn" id="settingsBtn" type="button" aria-haspopup="true" aria-expanded="false">⚙️ 设置</button>
          <div class="dropdown-menu" role="menu">
            <button type="button" class="dropdown-item" id="exportBtn" role="menuitem">📤 导出存档</button>
            <label class="dropdown-item" for="importFile" role="menuitem">📥 导入存档
              <input type="file" id="importFile" accept=".json,application/json" hidden>
            </label>
            <button type="button" class="dropdown-item danger" id="resetBtn" role="menuitem">🗑 清空进度</button>
          </div>
        </div>
      </div>
    </div>

    <section id="danFolders" class="dan-list"></section>
  </main>

  <div class="modal-backdrop" id="danModal">
    <div class="modal" role="dialog" aria-modal="true" aria-label="段位详情">
      <button class="modal-close" id="modalClose" aria-label="关闭" type="button">×</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="dim">非官方站点，与 KONAMI 无关 · 曲目信息请以机台实际为准</p>
  </footer>

  <script src="vendor/canvas-confetti.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
